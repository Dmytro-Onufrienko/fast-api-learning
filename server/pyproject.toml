[project]
name = "learn-fastapi-server"
version = "0.1.0"
description = "Learner workspace: real FastAPI code, run with uv."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-json-report>=1.5",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# Lesson tests live under content/<module>/<lesson>/tests and import the
# learner's code as `app.<module>.<lesson>.main`, so pytest's rootdir needs
# to resolve imports relative to the server/ workspace root regardless of
# where the test file physically lives (under /content, not /workspace).
addopts = "-q"
